spring:
  application:
    name: smedia
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    # Bắt buộc cung cấp qua biến môi trường JWT_SECRET hoặc trong application-dev.yaml (đã gitignore)
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-limit: 120
    default-window-seconds: 60
  storage:
    max-file-size-bytes: 10485760
    supabase:
      url: ${SUPABASE_URL:}
      service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${SUPABASE_STORAGE_BUCKET:smedia-media}
